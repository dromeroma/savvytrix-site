<nav
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-200"
  [class.bg-[var(--color-bg)]/80]="isScrolled()"
  [class.backdrop-blur-xl]="isScrolled()"
  [class.shadow-sm]="isScrolled()"
  [class.border-b]="isScrolled()"
  [class.border-[var(--color-border)]]="isScrolled()"
  role="navigation"
  aria-label="Navegación principal"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between lg:h-20">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-2.5 text-xl font-bold shrink-0">
        <span class="w-8 h-8 rounded-lg bg-[var(--color-logo-bg)] flex items-center justify-center">
          <img src="logo.svg" alt="Savvytrix Solutions logo" width="24" height="24">
        </span>
        <span>
          <span class="text-[var(--color-text)]">Savvy</span><span class="text-[var(--color-accent)]">trix</span>
        </span>
      </a>

      <!-- Desktop nav -->
      <div class="hidden lg:flex items-center gap-6 xl:gap-8">
        @for (link of navLinks; track link.href) {
          <a
            [href]="link.href"
            class="whitespace-nowrap text-sm font-medium text-[var(--color-text-muted)] hover:text-[var(--color-text)] transition-colors"
          >
            {{ link.label }}
          </a>
        }
      </div>

      <!-- Right side -->
      <div class="flex items-center gap-2 sm:gap-3">
        <app-theme-switcher />

        <a [href]="cta.waUrl()" target="_blank" rel="noopener noreferrer" aria-label="Escribir por WhatsApp" title="Escribir por WhatsApp"
          class="hidden sm:grid h-9 w-9 place-items-center rounded-xl border border-[var(--color-border)] text-[#25D366] hover:border-[#25D366] transition-colors">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88M20.46 3.49A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89a11.82 11.82 0 0 0-3.48-8.41z"/></svg>
        </a>
        <div class="hidden sm:block">
          <app-button variant="primary" size="sm" href="/#cotizar">
            Cotiza tu sitio
          </app-button>
        </div>

        <!-- Mobile hamburger -->
        <button
          type="button"
          class="lg:hidden p-2 text-[var(--color-text)] cursor-pointer"
          (click)="toggleMobile()"
          [attr.aria-expanded]="mobileMenuOpen()"
          aria-label="Abrir menú"
        >
          @if (mobileMenuOpen()) {
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          } @else {
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (mobileMenuOpen()) {
    <div class="lg:hidden border-t border-[var(--color-border)] bg-[var(--color-bg)]">
      <div class="px-4 py-6 space-y-1">
        @for (link of navLinks; track link.href) {
          <a
            [href]="link.href"
            class="block px-3 py-3 text-base font-medium text-[var(--color-text-muted)] hover:text-[var(--color-text)] hover:bg-[var(--color-bg-alt)] rounded-lg transition-colors"
            (click)="closeMobile()"
          >
            {{ link.label }}
          </a>
        }
        <div class="pt-4 mt-4 border-t border-[var(--color-border)] grid grid-cols-1 gap-2.5">
          <app-button variant="primary" size="md" href="/#cotizar" class="w-full" (click)="closeMobile()">
            Cotiza tu sitio
          </app-button>
          <app-button variant="whatsapp" size="md" [href]="cta.waUrl()" target="_blank" class="w-full">
            Escribir por WhatsApp
          </app-button>
        </div>
      </div>
    </div>
  }
</nav>
