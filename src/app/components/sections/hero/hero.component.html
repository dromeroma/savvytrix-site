<section class="relative min-h-[100svh] flex flex-col overflow-hidden pt-20 sm:pt-24" id="hero">
  <!-- Background grid pattern -->
  <div class="absolute inset-0 hero-grid-pattern pointer-events-none"></div>
  <!-- Background gradient -->
  <div class="absolute inset-0 bg-gradient-to-br from-[var(--color-hero-gradient-from)] to-[var(--color-hero-gradient-to)] pointer-events-none"></div>

  <div class="relative mx-auto max-w-7xl px-5 sm:px-8 lg:px-12 py-6 sm:py-8 w-full flex-1 flex items-center" @heroEnter>
    <div class="max-w-4xl mx-auto text-center w-full">

      <h1 class="hero-anim text-3xl sm:text-4xl md:text-5xl lg:text-[3.5rem] xl:text-6xl [@media(max-height:700px)]:lg:text-5xl font-bold tracking-tight text-[var(--color-text)] leading-[1.15]">
        {{ hero().titleTop }} <br class="hidden sm:block">
        <span class="text-[var(--color-accent)]">{{ hero().titleMain }}</span>
      </h1>

      <p class="hero-anim mt-5 sm:mt-6 [@media(max-height:700px)]:mt-3 text-base sm:text-lg lg:text-xl [@media(max-height:700px)]:lg:text-lg text-[var(--color-text-muted)] max-w-2xl mx-auto leading-relaxed">
        {{ hero().subtitle }}
      </p>

      <div class="hero-anim mt-8 sm:mt-10 [@media(max-height:700px)]:mt-5 flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center">
        <app-button variant="primary" size="lg" href="#cotizar">
          {{ hero().ctaLabel }}
        </app-button>
        <app-button variant="outline" size="lg" [href]="cta.waUrl()" target="_blank">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Escríbenos por WhatsApp
        </app-button>
      </div>

      <p class="hero-anim mt-6 [@media(max-height:700px)]:mt-3 text-sm text-[var(--color-text-muted)]">
        Cotización gratis · Soporte por WhatsApp · Clientes en Cartagena, San Onofre, Córdoba y Apartadó
      </p>
    </div>
  </div>

  <!-- Clientes reales: cinta de logos (clic → su sitio) -->
  <div class="relative w-full pb-10 sm:pb-12">
    <app-client-logos />
  </div>
</section>
