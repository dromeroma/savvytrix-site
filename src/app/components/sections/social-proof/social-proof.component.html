<section class="py-12 border-y border-[var(--color-border)] bg-[var(--color-bg-alt)] overflow-hidden">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <!-- Stats row -->
    <div class="flex flex-wrap justify-center gap-8 sm:gap-16 mb-10">
      @for (stat of stats; track stat.label) {
        <div class="text-center">
          <p class="text-2xl sm:text-3xl font-black text-[var(--color-text)]">
            <app-animated-counter [target]="stat.value" [suffix]="stat.suffix" [duration]="1800" />
          </p>
          <p class="text-xs text-[var(--color-text-muted)] mt-1">{{ stat.label }}</p>
        </div>
      }
    </div>
    <p class="text-center text-sm font-medium text-[var(--color-text-muted)] mb-8">
      Negocios de todo tipo ya venden más con Savvy
    </p>
  </div>

  <!-- Marquee — touch-scrollable on mobile -->
  <div class="relative marquee-container">
    <div class="flex animate-marquee whitespace-nowrap">
      @for (biz of businessTypes; track $index) {
        <div class="inline-flex items-center gap-3 mx-8 group">
          <div class="w-10 h-10 rounded-lg bg-[var(--color-border)] flex items-center justify-center opacity-60 group-hover:opacity-100 transition-opacity duration-300">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </div>
          <span class="text-sm font-medium text-[var(--color-text-muted)] group-hover:text-[var(--color-text)] transition-colors duration-300">
            {{ biz }}
          </span>
        </div>
      }
    </div>
  </div>
</section>
