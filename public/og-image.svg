<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Savvytrix Solutions — Transformamos ideas en tecnología que funciona">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#052e1d"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="95%" r="45%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g opacity="0.9">
    <circle cx="1050" cy="120" r="3" fill="#10B981"/>
    <circle cx="1100" cy="180" r="2" fill="#34D399"/>
    <circle cx="980" cy="80" r="2" fill="#A7F3D0"/>
    <circle cx="120" cy="540" r="3" fill="#10B981"/>
    <circle cx="80" cy="490" r="2" fill="#34D399"/>
  </g>

  <g transform="translate(80, 80)">
    <g filter="url(#soft-shadow)">
      <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#accent-gradient)"/>
      <path d="M 18 32 L 28 42 L 46 24" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(82, 6)">
      <text font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
        <tspan x="0" y="32" fill="#ffffff">Savvy</tspan><tspan fill="#34D399">trix</tspan>
      </text>
      <text x="0" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A7F3D0" letter-spacing="3">SOLUTIONS</text>
    </g>
  </g>

  <g transform="translate(80, 240)">
    <text font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">
      <tspan x="0" y="0" fill="#ffffff">Transformamos ideas</tspan>
      <tspan x="0" y="76" fill="#ffffff">en </tspan><tspan fill="url(#brand-gradient)">tecnología</tspan>
      <tspan x="0" y="152" fill="url(#brand-gradient)">que funciona.</tspan>
    </text>
  </g>

  <g transform="translate(80, 478)">
    <text font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#D1FAE5" letter-spacing="0.2">
      Software · IA · Mecatrónica · Ecosistema Savvy
    </text>
  </g>

  <g transform="translate(80, 530)" font-family="Inter, system-ui, sans-serif">
    <g>
      <rect x="0" y="0" width="190" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="22" cy="23" r="5" fill="#34D399"/>
      <text x="38" y="30" font-size="15" font-weight="600" fill="#ffffff">savvytrix.com</text>
    </g>
    <g transform="translate(206, 0)">
      <rect x="0" y="0" width="174" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="20" y="30" font-size="15" font-weight="600" fill="#ffffff">10 apps Savvy</text>
    </g>
    <g transform="translate(396, 0)">
      <rect x="0" y="0" width="180" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="20" y="30" font-size="15" font-weight="600" fill="#ffffff">Sede en LATAM</text>
    </g>
  </g>

  <g transform="translate(820, 180)" opacity="0.95">
    <g filter="url(#soft-shadow)">
      <rect x="0" y="0" width="280" height="280" rx="32" fill="#ffffff" fill-opacity="0.06" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.5"/>

      <g transform="translate(28, 28)">
        <rect width="100" height="100" rx="22" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.5"/>
        <g transform="translate(34, 32)" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="33" r="3"/><circle cx="28" cy="33" r="3"/>
          <path d="M 0 0 L 6 0 L 11 22 L 30 22 L 33 8 L 9 8"/>
        </g>
      </g>

      <g transform="translate(152, 28)">
        <rect width="100" height="100" rx="22" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.5"/>
        <g transform="translate(30, 28)" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="0" width="40" height="44" rx="4"/>
          <line x1="10" y1="10" x2="30" y2="10"/>
          <circle cx="10" cy="22" r="2"/><circle cx="20" cy="22" r="2"/><circle cx="30" cy="22" r="2"/>
          <circle cx="10" cy="34" r="2"/><circle cx="20" cy="34" r="2"/>
        </g>
      </g>

      <g transform="translate(28, 152)">
        <rect width="100" height="100" rx="22" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.5"/>
        <g transform="translate(28, 30)" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 22 36 C 12 28 0 22 4 12 C 6 4 16 4 22 12 C 28 4 38 4 40 12 C 44 22 32 28 22 36 Z"/>
        </g>
      </g>

      <g transform="translate(152, 152)">
        <rect width="100" height="100" rx="22" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.5"/>
        <g transform="translate(30, 30)" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="20" cy="14" r="6"/>
          <path d="M 6 40 C 6 30 12 24 20 24 C 28 24 34 30 34 40"/>
          <circle cx="34" cy="10" r="3"/>
          <path d="M 36 26 C 40 28 42 32 42 38"/>
        </g>
      </g>
    </g>
  </g>
</svg>
